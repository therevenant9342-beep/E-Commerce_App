<div class="products-container">

    <aside class="sidebar">
        <h3>Search</h3>
        <input type="text" [(ngModel)]="searchTerm" (input)="applyFilters()" placeholder="Search products...">

        <h3>Categories</h3>
        <select [(ngModel)]="selectedCategory" (change)="applyFilters()">
            <option value="">All Categories</option>
            @for (category of categories; track category) {
            <option [value]="category">{{ category }}</option>
            }
        </select>

        <h3>Price Range</h3>
        <div class="price-inputs">
            <input type="number" [(ngModel)]="minPrice" (input)="applyFilters()" placeholder="Min ($)">
            <span>-</span>
            <input type="number" [(ngModel)]="maxPrice" (input)="applyFilters()" placeholder="Max ($)">
        </div>

        <button (click)="resetFilters()" class="reset-btn">Clear Filters</button>
    </aside>

    <main class="product-grid">
        @for (product of filteredProducts; track product._id) {
        <div class="product-card">
            <img [src]="product.image" [alt]="product.title">
            <h4>{{ product.title }}</h4>
            <p>${{ product.price }}</p>
            <button>Add to Cart</button>
        </div>
        }
    </main>

</div>
