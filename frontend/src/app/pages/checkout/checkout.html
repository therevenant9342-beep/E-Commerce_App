<div class="checkout-container">
    <h2>Checkout</h2>

    <div class="order-summary">
        <h3>Order Summary</h3>
        <p>Total Items: {{ cartService.itemCount() }}</p>
        <p class="total-price">Amount Due: {{ cartService.cartTotal() | currency:'USD' }}</p>
    </div>

    <form [formGroup]="checkoutForm" (ngSubmit)="placeOrder()" class="checkout-form">

        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input id="fullName" type="text" formControlName="fullName" placeholder="John Doe">
        </div>

        <div class="form-group">
            <label for="address">Shipping Address</label>
            <input id="address" type="text" formControlName="address" placeholder="123 Main St">
        </div>

        <div class="form-group">
            <label for="city">City</label>
            <input id="city" type="text" formControlName="city" placeholder="New York">
        </div>

        <div class="form-group">
            <label for="cardNumber">Card Number</label>
            <input id="cardNumber" type="text" formControlName="cardNumber" placeholder="1234567890123456">
        </div>

        <button type="submit" class="place-order-btn">Place Order</button>

    </form>
</div>
